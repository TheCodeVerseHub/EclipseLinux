version: 2
updates:
  - package-ecosystem: cargo
    directory: /eclipse-installer
    open-pull-requests-limit: 7
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    open-pull-requests-limit: 7
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 7
    schedule:
      interval: weekly
